<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sijin's Fitness">
<meta name="theme-color" content="#020817">

<title>Sijin's Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #020817;
  --bg2: #080f22;
  --bg3: #0d1a35;
  --card: rgba(13,26,53,0.75);
  --card-solid: #0d1a35;
  --border: rgba(59,130,246,0.18);
  --blue: #3b82f6;
  --blue2: #60a5fa;
  --blue-glow: rgba(59,130,246,0.25);
  --P: #ef4444;
  --C: #3b82f6;
  --F: #eab308;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --muted: #475569;
  --green: #22c55e;
  --r: 16px;
  --nav-h: 68px;
  --sab: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Exo 2',sans-serif;color:var(--text)}
#root{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── SCROLLABLE AREA ── */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--sab) + 24px);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);background:rgba(2,8,23,0.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;color:var(--muted);transition:color .2s;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.nav-item.on{color:var(--blue2)}
.nav-icon{font-size:22px;transition:transform .2s}
.nav-item.on .nav-icon{transform:scale(1.15)}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--nav-h) + var(--sab) + 18px);right:20px;width:54px;height:54px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:50%;border:none;color:#fff;font-size:30px;font-weight:200;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:99;box-shadow:0 4px 24px rgba(59,130,246,.5);transition:transform .15s;line-height:1}
.fab:active{transform:scale(.9)}

/* ── PAGE HEADER ── */
.ph{padding:52px 18px 12px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.ph-title{font-size:26px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(135deg,#f1f5f9 0%,#93c5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ph-sub{font-size:12px;color:var(--sub);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.px{padding:0 18px}

/* ── SUMMARY CARD ── */
.sum-card{margin:0 18px 16px;background:linear-gradient(135deg,rgba(13,26,53,.95) 0%,rgba(29,78,216,.2) 100%);border:1px solid var(--border);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.sum-card::after{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(59,130,246,.1) 0%,transparent 70%);pointer-events:none}
.sum-inner{display:flex;align-items:center;gap:16px}
.sum-right{flex:1;min-width:0}
.cal-row{margin-bottom:14px}
.cal-num{font-size:30px;font-weight:900;font-family:'Space Mono',monospace;line-height:1;color:var(--text)}
.cal-denom{font-size:13px;color:var(--sub);margin-top:1px}
.macro-list{display:flex;flex-direction:column;gap:7px}
.macro-row{display:flex;align-items:center;gap:7px}
.m-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.m-label{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;font-weight:600;width:12px}
.m-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.m-bar{height:100%;border-radius:2px;transition:width .5s ease}
.m-val{font-size:11px;font-weight:700;font-family:'Space Mono',monospace;color:var(--text);white-space:nowrap}
.m-goal{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;white-space:nowrap}

/* ── LOG TABLE ── */
.sec-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:16px 18px 8px}
.log-wrap{margin:0 18px}
.log-table{width:100%;border-collapse:collapse;font-size:11px}
.log-table th{color:var(--muted);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.07em;padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)}
.log-table td{padding:9px 4px;border-bottom:1px solid rgba(59,130,246,.06);vertical-align:middle}
.log-table tr:last-child td{border-bottom:none}
.food-nm{font-weight:700;font-size:11px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.food-sv{font-size:9px;color:var(--sub)}
.mono{font-family:'Space Mono',monospace}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:6px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.del-btn:active{color:#ef4444;background:rgba(239,68,68,.1)}
.empty-log{text-align:center;padding:36px 16px;color:var(--muted)}
.empty-icon{font-size:38px;margin-bottom:8px;opacity:.5}
.empty-txt{font-size:13px}

/* ── REPORTS BTN ── */
.rpt-btn{margin:12px 18px 0;width:calc(100% - 36px);padding:13px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--blue2);font-size:13px;font-weight:700;font-family:'Exo 2',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.rpt-btn:active{background:var(--bg3)}

/* ── MODAL OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ── BOTTOM SHEET ── */
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--border);max-height:91dvh;display:flex;flex-direction:column;padding-bottom:calc(var(--sab) + 12px);animation:slideup .3s cubic-bezier(.32,.72,0,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--muted);border-radius:2px;margin:12px auto 14px}
.sheet-head{padding:0 18px 12px;display:flex;align-items:center;justify-content:space-between}
.sheet-title{font-size:20px;font-weight:800}
.close-btn{width:30px;height:30px;background:var(--card);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-size:16px;flex-shrink:0}

/* ── SEARCH ── */
.search{margin:0 18px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px}
.search input{flex:1;background:none;border:none;color:var(--text);font-size:14px;font-family:'Exo 2',sans-serif;padding:11px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.search-ico{color:var(--muted);font-size:15px;flex-shrink:0}

/* ── CAT TABS ── */
.cat-row{display:flex;gap:7px;padding:0 18px 12px;overflow-x:auto;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--card);color:var(--sub);letter-spacing:.03em}
.cat-pill.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── FOOD CARDS (picker) ── */
.cards-list{flex:1;overflow-y:auto;padding:0 18px 16px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none}
.cards-list::-webkit-scrollbar{display:none}
.f-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px;display:flex;align-items:center;gap:11px;position:relative;min-height:80px}
.f-info{flex:1;min-width:0;padding-right:60px}
.f-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-serv{font-size:10px;color:var(--sub);margin-top:1px}
.f-kcal{font-size:12px;font-weight:700;color:var(--blue2);font-family:'Space Mono',monospace;margin-top:3px}
.f-stars{position:absolute;top:10px;right:11px}
.f-actions{position:absolute;bottom:9px;right:9px;display:flex;align-items:center;gap:3px}
.qty-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:300;line-height:1;flex-shrink:0}
.qty-btn:active{background:var(--blue);border-color:var(--blue)}
.qty-val{min-width:28px;text-align:center;font-size:12px;font-weight:700;font-family:'Space Mono',monospace}
.add-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;font-family:'Exo 2',sans-serif;cursor:pointer;white-space:nowrap}
.add-btn:active{background:#2563eb}
.no-results{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}

/* ── STARS ── */
.stars{display:flex;gap:1px;line-height:1}

/* ── GOALS TAB ── */
.g-content{padding:0 18px}
.form-group{margin-bottom:13px}
.f-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.f-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 13px;color:var(--text);font-size:14px;font-family:'Exo 2',sans-serif;font-weight:500;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.f-input:focus{border-color:var(--blue)}
.f-input option{background:var(--bg2);color:var(--text)}
.goal-pills{display:flex;gap:7px;flex-wrap:wrap}
.goal-pill{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--sub);transition:all .2s;letter-spacing:.02em}
.goal-pill.on{border-color:var(--blue);background:rgba(59,130,246,.15);color:var(--blue2)}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.r-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;text-align:center}
.r-val{font-size:24px;font-weight:900;font-family:'Space Mono',monospace;line-height:1}
.r-lbl{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.r-card.rcal .r-val{color:var(--blue2)}
.r-card.rp .r-val{color:var(--P)}
.r-card.rc .r-val{color:var(--C)}
.r-card.rf .r-val{color:var(--F)}
.primary-btn{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:none;border-radius:13px;color:#fff;font-size:14px;font-weight:800;font-family:'Exo 2',sans-serif;cursor:pointer;letter-spacing:.02em;transition:all .15s;margin-top:6px;box-shadow:0 4px 16px rgba(59,130,246,.3)}
.primary-btn:active{transform:scale(.97);background:linear-gradient(135deg,#2563eb,#1e40af)}
.save-hint{font-size:11px;color:var(--sub);text-align:center;margin-top:8px}

/* ── ADD FOOD TAB ── */
.a-content{padding:0 18px}
.star-inp{display:flex;gap:4px}
.s-btn{font-size:26px;cursor:pointer;background:none;border:none;padding:2px;transition:transform .1s;line-height:1}
.s-btn:active{transform:scale(1.25)}

/* ── REPORTS MODAL ── */
.period-row{display:flex;background:rgba(13,26,53,.8);border-radius:11px;margin:0 18px 14px;padding:3px}
.p-tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;transition:all .2s;color:var(--muted)}
.p-tab.on{background:var(--blue);color:#fff}
.rpt-body{flex:1;overflow-y:auto;padding:0 18px;scrollbar-width:none}
.rpt-body::-webkit-scrollbar{display:none}
.stat-block{margin-bottom:16px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(59,130,246,.08)}
.stat-row:last-child{border:none}
.s-name{font-size:12px;color:var(--sub)}
.s-val{font-size:14px;font-weight:700;font-family:'Space Mono',monospace}
.chart-wrap{margin:12px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.chart-title{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.no-data{text-align:center;padding:40px 0;color:var(--muted);font-size:13px}

/* ── TOAST ── */
.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:rgba(13,26,53,.97);border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-size:12px;font-weight:700;z-index:500;white-space:nowrap;animation:tin .25s ease,tout .25s ease 2.1s forwards;box-shadow:0 4px 20px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tout{from{opacity:1}to{opacity:0;pointer-events:none}}

/* ── SYNC ── */
.sync-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:10px;color:#22c55e;font-size:11px;font-weight:700;font-family:'Exo 2',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.sync-btn:active{background:rgba(34,197,94,.22)}
.sync-btn.syncing{color:#94a3b8;border-color:var(--border);background:transparent;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between}
.sync-url-wrap{margin:0 18px 12px}
.sync-note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.4}
/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:14px 0}
</style>
</head>

/* ─────────── UTILS ─────────── */
const today = () => new Date().toISOString().split('T')[0];
const rnd = n => Math.round(n);
const fmt1 = n => Number(n).toFixed(1);

const calcMacros = (w, h, age, act, goal) => {
  const bmr = 10*w + 6.25*h - 5*age + 5;
  const mults = {sedentary:1.2,light:1.375,moderate:1.55,active:1.725,veryActive:1.9};
  const tdee = bmr * (mults[act] || 1.55);
  // Protein: 0.8g per lb of bodyweight (1 kg = 2.205 lbs)
  const prot = rnd(w * 2.205 * 0.8);
  let cal, fat, carbs;
  if (goal === 'bulk')      { cal=rnd(tdee+400);  fat=rnd(w*1.0); }
  else if (goal === 'cut')  { cal=rnd(tdee-850);  fat=rnd(w*0.8); }  // ~1800 for Sijin
  else if (goal === 'gain') { cal=rnd(tdee+200);  fat=rnd(w*0.9); }
  else                      { cal=rnd(tdee-850);  fat=rnd(w*0.8); }  // lose fat ~1800
  carbs = Math.max(50, rnd((cal - prot*4 - fat*9)/4));
  return {cal, prot, carbs, fat};
};

const DEFAULT_GOALS = () => {
  const m = calcMacros(60,160,14,'active','gain');
  return {cal:m.cal, prot:m.prot, carbs:m.carbs, fat:m.fat, weight:60, height:160, age:14, act:'active', goal:'gain'};
};

/* ─────────── SVG DONUT ─────────── */
const Donut = ({protein=0,carbs=0,fat=0,calories,size=80,sw=10}) => {
  const cx=size/2, cy=size/2, r=(size-sw)/2;
  const pCal=protein*4, cCal=carbs*4, fCal=fat*9;
  const total=pCal+cCal+fCal;

  const xy=(deg)=>{
    const rad=(deg-90)*Math.PI/180;
    return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
  };

  const arc=(s,e)=>{
    if(e-s<0.5) return null;
    if(e-s>=359.9){
      const [ax,ay]=xy(s); const [bx,by]=xy(s+180);
      return `M${ax},${ay} A${r},${r},0,0,1,${bx},${by} A${r},${r},0,0,1,${ax},${ay}`;
    }
    const [x1,y1]=xy(s); const [x2,y2]=xy(e);
    const lg=e-s>180?1:0;
    return `M${x1},${y1} A${r},${r},0,${lg},1,${x2},${y2}`;
  };

  const fs=size<=70?10:13;
  const sf=size<=70?8:10;

  if(total===0){
    return React.createElement('svg',{width:size,height:size,style:{display:'block'}},
      React.createElement('circle',{cx,cy,r,fill:'none',stroke:'#1e293b',strokeWidth:sw}),
      React.createElement('text',{x:cx,y:cy,textAnchor:'middle',dominantBaseline:'middle',fill:'#475569',fontSize:sf,fontFamily:'Space Mono,monospace'},'—')
    );
  }

  const pa=(pCal/total)*360, ca=(cCal/total)*360, fa=(fCal/total)*360;
  const segs=[
    {d:arc(0,pa),col:'#ef4444'},
    {d:arc(pa,pa+ca),col:'#3b82f6'},
    {d:arc(pa+ca,pa+ca+fa),col:'#eab308'},
  ].filter(s=>s.d);

  const calShow = calories !== undefined ? rnd(calories) : rnd(total/4);

  return React.createElement('svg',{width:size,height:size,style:{display:'block'}},
    React.createElement('circle',{cx,cy,r,fill:'none',stroke:'#1e293b',strokeWidth:sw}),
    ...segs.map((s,i)=>React.createElement('path',{key:i,d:s.d,fill:'none',stroke:s.col,strokeWidth:sw,strokeLinecap:'butt'})),
    calories!==undefined && React.createElement('text',{x:cx,y:cy-4,textAnchor:'middle',fill:'#f1f5f9',fontSize:fs,fontWeight:700,fontFamily:'Space Mono,monospace'},calShow),
    calories!==undefined && React.createElement('text',{x:cx,y:cy+8,textAnchor:'middle',fill:'#64748b',fontSize:sf-1,fontFamily:'Exo 2,sans-serif'},'kcal')
  );
};

/* ─────────── BAR CHART ─────────── */
const BarChart = ({data,goalCal}) => {
  if(!data||!data.length) return React.createElement('div',{className:'no-data'},'No data yet');
  const maxV = Math.max(...data.map(d=>d.cal), goalCal||0, 100)*1.1;
  const W=340,H=110,pt=8,pl=0,pr=0,pb=22;
  const cW=W-pl-pr, cH=H-pt-pb;
  const bw=Math.max(4, Math.floor((cW/data.length)*0.65));
  const gap=cW/data.length;

  return React.createElement('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,style:{overflow:'visible'}},
    goalCal && React.createElement('line',{
      x1:pl,y1:pt+cH*(1-goalCal/maxV),x2:W-pr,y2:pt+cH*(1-goalCal/maxV),
      stroke:'#3b82f6',strokeWidth:1,strokeDasharray:'4,3',opacity:.5
    }),
    ...data.map((d,i)=>{
      const bH=Math.max(2,(d.cal/maxV)*cH);
      const x=pl+i*gap+gap/2-bw/2;
      const y=pt+cH-bH;
      const col=goalCal?(d.cal>=goalCal?'#22c55e':'#ef4444'):'#3b82f6';
      return React.createElement('rect',{key:i,x,y,width:bw,height:bH,fill:col,rx:3,opacity:.85});
    }),
    ...data.map((d,i)=>{
      if(data.length>10&&i%Math.ceil(data.length/7)!==0) return null;
      const x=pl+i*gap+gap/2;
      return React.createElement('text',{key:'l'+i,x,y:H-4,textAnchor:'middle',fill:'#475569',fontSize:7,fontFamily:'Space Mono,monospace'},d.date.slice(5));
    }).filter(Boolean)
  );
};

/* ─────────── REPORTS ─────────── */
const Reports = ({allLogs,goals,foods,onClose}) => {
  const [period,setPeriod]=useState('weekly');
  const days=period==='weekly'?7:period==='monthly'?30:365;
  const now=new Date();

  const data=useMemo(()=>{
    const arr=[];
    for(let i=days-1;i>=0;i--){
      const d=new Date(now);d.setDate(d.getDate()-i);
      const key=d.toISOString().split('T')[0];
      const log=allLogs[key]||[];
      let cal=0,prot=0,carbs=0,fat=0;
      log.forEach(e=>{
        const food=foods.find(f=>f.id===e.foodId);
        if(!food) return;
        cal+=food.cal*e.servings; prot+=food.p*e.servings;
        carbs+=food.c*e.servings; fat+=food.f*e.servings;
      });
      if(log.length>0) arr.push({date:key,cal:rnd(cal),prot:rnd(prot),carbs:rnd(carbs),fat:rnd(fat)});
      else arr.push({date:key,cal:0,prot:0,carbs:0,fat:0});
    }
    return arr;
  },[period,allLogs,foods]);

  const activeDays=data.filter(d=>d.cal>0);
  const avg=f=>activeDays.length?rnd(activeDays.reduce((s,d)=>s+d[f],0)/activeDays.length):0;
  const avgCal=avg('cal'), avgP=avg('prot'), avgC=avg('carbs'), avgF=avg('fat');

  const goalAchieved=activeDays.filter(d=>{
    const g=goals.goal;
    const protOk=d.prot>=goals.prot;
    if(g==='cut'||g==='lose') return d.cal<=goals.cal&&protOk;
    return d.cal>=goals.cal*0.9&&protOk;
  }).length;

  return React.createElement('div',{className:'overlay',onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    React.createElement('div',{className:'sheet'},
      React.createElement('div',{className:'sheet-handle'}),
      React.createElement('div',{className:'sheet-head'},
        React.createElement('div',{className:'sheet-title'},'📊 Reports'),
        React.createElement('div',{className:'close-btn',onClick:onClose},'✕')
      ),
      React.createElement('div',{className:'period-row'},
        ['weekly','monthly','yearly'].map(p=>
          React.createElement('div',{key:p,className:`p-tab${period===p?' on':''}`,onClick:()=>setPeriod(p)},
            p.charAt(0).toUpperCase()+p.slice(1))
        )
      ),
      React.createElement('div',{className:'rpt-body'},
        React.createElement('div',{className:'stat-block'},
          React.createElement('div',{className:'stat-row'},
            React.createElement('span',{className:'s-name'},'Days tracked'),
            React.createElement('span',{className:'s-val'},`${activeDays.length} / ${days}`)
          ),
          React.createElement('div',{className:'stat-row'},
            React.createElement('span',{className:'s-name'},'Goals hit 🎯'),
            React.createElement('span',{className:'s-val',style:{color:'#22c55e'}},`${goalAchieved}d`)
          ),
          React.createElement('div',{className:'stat-row'},
            React.createElement('span',{className:'s-name'},'Avg Calories'),
            React.createElement('span',{className:'s-val',style:{color:'#60a5fa'}},`${avgCal} / ${goals.cal}`)
          ),
          React.createElement('div',{className:'stat-row'},
            React.createElement('span',{className:'s-name'},'Avg Protein'),
            React.createElement('span',{className:'s-val',style:{color:'#ef4444'}},`${avgP}g / ${goals.prot}g`)
          ),
          React.createElement('div',{className:'stat-row'},
            React.createElement('span',{className:'s-name'},'Avg Carbs'),
            React.createElement('span',{className:'s-val',style:{color:'#3b82f6'}},`${avgC}g / ${goals.carbs}g`)
          ),
          React.createElement('div',{className:'stat-row'},
            React.createElement('span',{className:'s-name'},'Avg Fat'),
            React.createElement('span',{className:'s-val',style:{color:'#eab308'}},`${avgF}g / ${goals.fat}g`)
          )

                    React.createElement('td',{className:'mono',style:{color:'#3b82f6'}},rnd(food.c*sv)),
                    React.createElement('td',{className:'mono',style:{color:'#eab308'}},rnd(food.f*sv)),
                    React.createElement('td',null,
                      React.createElement('button',{className:'del-btn',onClick:()=>onRemove(entry.id)},'✕')
                    )
                  );
                })
              )
            )
          )
        ),
    React.createElement('button',{className:'rpt-btn',onClick:onReports},'📊  View Reports')
  );
};

/* ─────────── GOALS TAB ─────────── */
const GoalsTab = ({goals,onSave}) => {
  const [w,setW]=useState(String(goals.weight));
  const [h,setH]=useState(String(goals.height));
  const [age,setAge]=useState(String(goals.age));
  const [act,setAct]=useState(goals.act);
  const [goal,setGoal]=useState(goals.goal);
  const [res,setRes]=useState({cal:goals.cal,prot:goals.prot,carbs:goals.carbs,fat:goals.fat});
  const [saved,setSaved]=useState(false);

  const calc=()=>{
    const m=calcMacros(parseFloat(w)||60,parseFloat(h)||160,parseInt(age)||14,act,goal);
    setRes(m);
  };

  const save=()=>{
    onSave({...res,weight:parseFloat(w)||60,height:parseFloat(h)||160,age:parseInt(age)||14,act,goal});
    setSaved(true);setTimeout(()=>setSaved(false),1500);
  };

  const GOAL_OPTS=[{v:'bulk',l:'Bulk 💪'},{v:'cut',l:'Cut 🔥'},{v:'gain',l:'Gain Muscle 🏋️'},{v:'lose',l:'Lose Fat ⚡'}];
  const ACT_OPTS=[{v:'sedentary',l:'Sedentary'},{v:'light',l:'Lightly Active'},{v:'moderate',l:'Moderately Active'},{v:'active',l:'Very Active (4-5d)'},{v:'veryActive',l:'Athlete (6-7d)'}];

  return React.createElement('div',{className:'screen'},
    React.createElement('div',{className:'ph'},
      React.createElement('div',{className:'ph-title'},'Goals'),
      React.createElement('div',{className:'ph-sub'},'Calculate your daily targets')
    ),
    React.createElement('div',{className:'g-content'},
      React.createElement('div',{className:'card',style:{padding:'16px',marginBottom:12}},
        React.createElement('div',{style:{display:'flex',gap:10,marginBottom:12}},
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Weight (kg)'),
            React.createElement('input',{className:'f-input',type:'number',value:w,onChange:e=>setW(e.target.value),inputMode:'decimal'})
          ),
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Height (cm)'),
            React.createElement('input',{className:'f-input',type:'number',value:h,onChange:e=>setH(e.target.value),inputMode:'decimal'})
          ),
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Age'),
            React.createElement('input',{className:'f-input',type:'number',value:age,onChange:e=>setAge(e.target.value),inputMode:'numeric'})
          )
        ),
        React.createElement('div',{className:'form-group'},
          React.createElement('label',{className:'f-label'},'Activity Level'),
          React.createElement('select',{className:'f-input',value:act,onChange:e=>setAct(e.target.value)},
            ACT_OPTS.map(o=>React.createElement('option',{key:o.v,value:o.v},o.l))
          )
        ),
        React.createElement('div',{className:'form-group'},
          React.createElement('label',{className:'f-label'},'Goal'),
          React.createElement('div',{className:'goal-pills'},
            GOAL_OPTS.map(o=>React.createElement('div',{key:o.v,className:`goal-pill${goal===o.v?' on':''}`,onClick:()=>setGoal(o.v)},o.l))
          )
        ),
        React.createElement('button',{className:'primary-btn',onClick:calc},'⚡ Calculate')
      ),
      React.createElement('div',{className:'results-grid'},
        [{cls:'rcal',col:'#60a5fa',v:res.cal,lbl:'Calories'},
         {cls:'rp',col:'#ef4444',v:res.prot,lbl:'Protein (g)'},
         {cls:'rc',col:'#3b82f6',v:res.carbs,lbl:'Carbs (g)'},
         {cls:'rf',col:'#eab308',v:res.fat,lbl:'Fat (g)'}].map(r=>
          React.createElement('div',{key:r.cls,className:`r-card ${r.cls}`},
            React.createElement('div',{className:'r-val'},r.v),
            React.createElement('div',{className:'r-lbl'},r.lbl)
          )
        )
      ),
      React.createElement('button',{className:'primary-btn save-btn',style:{opacity:saved?.7:1},onClick:save},saved?'✓ Saved!':'💾 Save as Daily Goals'),
      React.createElement('div',{className:'save-hint'},'Current goals: '+goals.cal+' kcal | P '+goals.prot+'g | C '+goals.carbs+'g | F '+goals.fat+'g')
    )
  );
};

/* ─────────── ADD FOOD TAB ─────────── */
const AddFoodTab = ({onAdd}) => {
  const blank={name:'',cat:'breakfast',serving:'',cal:'',p:'',c:'',f:'',rating:3};
  const [form,setForm]=useState(blank);
  const [ok,setOk]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const submit=()=>{
    if(!form.name.trim()||!form.cal) return;
    onAdd({
      id:'u'+Date.now(),name:form.name.trim(),serving:form.serving||'1 serving',
      cal:parseFloat(form.cal)||0,p:parseFloat(form.p)||0,c:parseFloat(form.c)||0,f:parseFloat(form.f)||0,
      rating:form.rating,cat:[form.cat]
    });
    setForm(blank);setOk(true);setTimeout(()=>setOk(false),1500);
  };

  const CAT_OPTS=[{v:'breakfast',l:'Breakfast'},{v:'lunch',l:'Lunch'},{v:'dinner',l:'Dinner'},{v:'drinks',l:'Drinks'},{v:'snacks',l:'Snacks'}];
  const inp=(label,key,type='text',mode)=>React.createElement('div',{className:'form-group'},
    React.createElement('label',{className:'f-label'},label),
    React.createElement('input',{className:'f-input',type:type,inputMode:mode,value:form[key],onChange:e=>set(key,e.target.value)})
  );

  return React.createElement('div',{className:'screen'},
    React.createElement('div',{className:'ph'},
      React.createElement('div',{className:'ph-title'},'Add Food'),
      React.createElement('div',{className:'ph-sub'},'Add to your food library')
    ),
    React.createElement('div',{className:'a-content'},
      React.createElement('div',{className:'card',style:{padding:'16px'}},
        inp('Food Name','name','text'),
        React.createElement('div',{className:'form-group'},
          React.createElement('label',{className:'f-label'},'Category'),
          React.createElement('select',{className:'f-input',value:form.cat,onChange:e=>set('cat',e.target.value)},
            CAT_OPTS.map(o=>React.createElement('option',{key:o.v,value:o.v},o.l))
          )
        ),
        inp('Serving Size (description)','serving','text'),
        React.createElement('div',{style:{display:'flex',gap:9}},
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Calories'),
            React.createElement('input',{className:'f-input',type:'number',inputMode:'decimal',value:form.cal,onChange:e=>set('cal',e.target.value)})
          ),
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Protein (g)'),
            React.createElement('input',{className:'f-input',type:'number',inputMode:'decimal',value:form.p,onChange:e=>set('p',e.target.value)})
          )
        ),
        React.createElement('div',{style:{display:'flex',gap:9,marginTop:9}},
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Carbs (g)'),
            React.createElement('input',{className:'f-input',type:'number',inputMode:'decimal',value:form.c,onChange:e=>set('c',e.target.value)})
          ),
          React.createElement('div',{style:{flex:1}},
            React.createElement('label',{className:'f-label'},'Fat (g)'),
            React.createElement('input',{className:'f-input',type:'number',inputMode:'decimal',value:form.f,onChange:e=>set('f',e.target.value)})
          )
        ),
        React.createElement('div',{className:'form-group',style:{marginTop:13}},
          React.createElement('label',{className:'f-label'},'Your Rating'),
          React.createElement(StarInput,{value:form.rating,onChange:v=>set('rating',v)})
        ),
        React.createElement('button',{
          className:'primary-btn',style:{opacity:ok?.7:1},onClick:submit
        },ok?'✓ Added!':'+ Add to Library')
      )
    )
  );
};

/* ─────────── APP ─────────── */
const App = () => {
  const [tab,setTab]=useState('home');
  const [showPicker,setShowPicker]=useState(false);
  const [showReports,setShowReports]=useState(false);
  const [toast,setToast]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState('');
  const [dateKey,setDateKey]=useState(today()); // forces re-render on day change

  // Daily refresh: check every 60s if date rolled over
  useEffect(()=>{
    const iv=setInterval(()=>{
      const t=today();
      if(t!==dateKey) setDateKey(t);
    },60000);
    return()=>clearInterval(iv);
  },[dateKey]);

  const [customFoods,setCustomFoods]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('sfa_custom')||'[]')}catch{return []}
  });
  const [allLogs,setAllLogs]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('sfa_logs')||'{}')}catch{return {}}
  });
  const [goals,setGoals]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('sfa_goals')||'null')||DEFAULT_GOALS()}catch{return DEFAULT_GOALS()}
  });
  const [syncUrl,setSyncUrlState]=useState(()=>localStorage.getItem('sfa_sync_url')||'');

  useEffect(()=>{localStorage.setItem('sfa_custom',JSON.stringify(customFoods))},[customFoods]);
  useEffect(()=>{localStorage.setItem('sfa_logs',JSON.stringify(allLogs))},[allLogs]);
  useEffect(()=>{localStorage.setItem('sfa_goals',JSON.stringify(goals))},[goals]);

  const allFoods=useMemo(()=>[...DB0,...customFoods],[customFoods]);
  const todayKey=dateKey;
  const todayLog=allLogs[todayKey]||[];

  const totals=useMemo(()=>todayLog.reduce((acc,e)=>{
    const f=allFoods.find(x=>x.id===e.foodId);
    if(!f) return acc;
    return {cal:acc.cal+f.cal*e.servings, prot:acc.prot+f.p*e.servings, carbs:acc.carbs+f.c*e.servings, fat:acc.fat+f.f*e.servings};
  },{cal:0,prot:0,carbs:0,fat:0}),[todayLog,allFoods]);

  const syncToSheets = useCallback(async ()=>{
    const url = syncUrl || localStorage.getItem('sfa_sync_url');
    if(!url){
      const entered = window.prompt('Paste your Google Apps Script URL:');
      if(!entered) return;
      localStorage.setItem('sfa_sync_url', entered);
      setSyncUrlState(entered);
      return;
    }
    setSyncing(true);
    try{
      const logData = todayLog.map(e=>{
        const fd=allFoods.find(x=>x.id===e.foodId);
        if(!fd) return null;
        return {name:fd.name,servings:e.servings,cal:rnd(fd.cal*e.servings),protein:rnd(fd.p*e.servings),carbs:rnd(fd.c*e.servings),fat:rnd(fd.f*e.servings)};
      }).filter(Boolean);
      await fetch(url,{
        method:'POST',mode:'no-cors',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          date:todayKey,log:logData,
          totals:{cal:rnd(totals.cal),protein:rnd(totals.prot),carbs:rnd(totals.carbs),fat:rnd(totals.fat)},
          goals:{cal:goals.cal,protein:goals.prot,carbs:goals.carbs,fat:goals.fat}
        })
      });
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      setLastSync(t);
      showToast('✓ Synced to Sheets!');
    }catch(err){
      showToast('Sync failed — check URL');
    }finally{
      setSyncing(false);
    }
  },[syncUrl,todayLog,allFoods,todayKey,totals,goals]);

  const addToLog=useCallback((foodId,servings)=>{
    const food=allFoods.find(f=>f.id===foodId);
    setAllLogs(prev=>({...prev,[todayKey]:[...(prev[todayKey]||[]),{id:Date.now().toString(),foodId,servings}]}));
    if(food) showToast(`✓ ${food.name}`);
  },[allFoods,todayKey]);

  const removeFromLog=useCallback((logId)=>{
    setAllLogs(prev=>({...prev,[todayKey]:(prev[todayKey]||[]).filter(e=>e.id!==logId)}));
  },[todayKey]);

  const saveGoals=useCallback((g)=>setGoals(g),[]);
  const addCustomFood=useCallback((food)=>{setCustomFoods(p=>[...p,food])},[]);
  const showToast=(msg)=>{setToast(null);setTimeout(()=>setToast(msg),50)};

  const NAV=[
    {id:'home',icon:'🏠',lbl:'Home'},
    {id:'goals',icon:'🎯',lbl:'Goals'},
    {id:'add',icon:'➕',lbl:'Add Food'},
  ];

  return React.createElement('div',{style:{height:'100dvh',display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--bg)'}},
    tab==='home'&&React.createElement(HomeTab,{foods:allFoods,todayLog,totals,goals,onRemove:removeFromLog,onPicker:()=>setShowPicker(true),onReports:()=>setShowReports(true),onSync:syncToSheets,syncing,lastSync}),
    tab==='goals'&&React.createElement(GoalsTab,{goals,onSave:saveGoals}),
    tab==='add'&&React.createElement(AddFoodTab,{onAdd:addCustomFood}),

    tab==='home'&&React.createElement('button',{className:'fab',onClick:()=>setShowPicker(true)},'+'),
    showPicker&&React.createElement(FoodPicker,{foods:allFoods,onAdd:addToLog,onClose:()=>setShowPicker(false)}),
    showReports&&React.createElement(Reports,{allLogs,goals,foods:allFoods,onClose:()=>setShowReports(false)}),
    toast&&React.createElement(Toast,{msg:toast,done:()=>setToast(null)}),

    React.createElement('div',{className:'nav'},
      NAV.map(n=>React.createElement('div',{key:n.id,className:`nav-item${tab===n.id?' on':''}`,onClick:()=>setTab(n.id)},
        React.createElement('span',{className:'nav-icon'},n.icon),
        n.lbl
      ))
    )
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
