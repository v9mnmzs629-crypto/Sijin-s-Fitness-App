<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sijin's Fitness">
<meta name="theme-color" content="#020817">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sijin's Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020817;--bg2:#080f22;--bg3:#0d1a35;--card:rgba(13,26,53,.78);--border:rgba(59,130,246,.18);--blue:#3b82f6;--blue2:#60a5fa;--P:#ef4444;--C:#3b82f6;--F:#eab308;--text:#f1f5f9;--sub:#94a3b8;--muted:#475569;--green:#22c55e;--r:16px;--nav:64px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:'Exo 2',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
#root{position:fixed;inset:0}
.mono{font-family:'Space Mono',monospace}
.app{position:absolute;inset:0;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:calc(var(--nav) + var(--sab) + 100px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab::-webkit-scrollbar{display:none}
.tab.on{display:block;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes slidedown{from{transform:none}to{transform:translateY(100%)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rise{animation:rise .4s ease both}

/* header */
.ph{padding:calc(var(--sat) + 16px) 18px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ph-title{font-size:27px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(135deg,#f1f5f9 0%,#93c5fd 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ph-sub{font-size:12px;color:var(--sub);margin-top:2px}
.ph-right{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px currentColor;color:var(--green);flex-shrink:0}
.dot.warn{background:#eab308;color:#eab308;animation:pulse 1.2s infinite}
.dot.off{background:var(--muted);color:var(--muted);box-shadow:none}
.round{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);font-size:28px;font-weight:200;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(59,130,246,.45);line-height:1;transition:transform .15s}
.round:active{transform:scale(.9)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);background:rgba(2,8,23,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:color .2s}
.nav-i span{font-size:21px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);filter:grayscale(1) opacity(.6)}
.nav-i.on{color:var(--blue2)}
.nav-i.on span{transform:translateY(-2px) scale(1.18);filter:none}
.nav-i.main{font-size:11px}
.fab{position:fixed;right:20px;bottom:calc(var(--nav) + var(--sab) + 18px);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);font-size:32px;font-weight:200;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 26px rgba(59,130,246,.55);z-index:90;transition:transform .15s;line-height:1;animation:pop .4s ease}
.fab:active{transform:scale(.88)}

/* generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pad{padding:16px}.mx{margin:0 18px}.mb{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.inp,.sel{width:100%;background:rgba(2,8,23,.55);border:1px solid var(--border);border-radius:11px;padding:11px 12px;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.inp:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.inp::placeholder{color:var(--muted)}
.sel option{background:var(--bg2)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.fg{margin-bottom:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:13px;font-weight:800;font-size:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 4px 16px rgba(59,130,246,.3);transition:transform .15s,opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--card);border:1px solid var(--border);box-shadow:none;color:var(--blue2)}
.btn.danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);box-shadow:none;color:#f87171}
.btn.sm{padding:9px 12px;font-size:12px;border-radius:10px;width:auto}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--sub);transition:all .2s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,.4)}
.seg{display:flex;background:rgba(13,26,53,.85);border-radius:12px;padding:3px;margin:0 18px 14px}
.seg>button{flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);transition:all .2s}
.seg>button.on{background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.4)}
.sec{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:18px 18px 8px}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13px}.empty.small{padding:20px}
.empty b{display:block;font-size:34px;opacity:.5;margin-bottom:6px}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(59,130,246,.15);color:var(--blue2);letter-spacing:.03em}
.pill.g{background:rgba(34,197,94,.14);color:#4ade80}.pill.y{background:rgba(234,179,8,.14);color:#facc15}
.stars{display:inline-flex;gap:1px;line-height:1}.stars span{color:#334155}.stars span.on{color:#eab308}
.stars span.half{background:linear-gradient(90deg,#eab308 50%,#334155 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.star-in{display:flex;gap:6px}.star-in button{font-size:28px;color:#334155;transition:transform .15s}.star-in button.on{color:#eab308}.star-in button.half{background:linear-gradient(90deg,#eab308 50%,#334155 50%);-webkit-background-clip:text;background-clip:text;color:transparent}.star-in button:active{transform:scale(1.25)}

/* dashboard */
.dash{margin:0 18px 14px;padding:18px;border-radius:24px;background:linear-gradient(135deg,rgba(13,26,53,.96),rgba(29,78,216,.22));border:1px solid var(--border);position:relative;overflow:hidden}
.dash::after{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(59,130,246,.14),transparent 70%);pointer-events:none}
.dash-in{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.dash-r{flex:1;min-width:0}
.left{font-size:12px;color:var(--sub);margin-bottom:12px}.left b{color:var(--text);font-size:15px;font-family:'Space Mono',monospace}
.mrow{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.mrow i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mrow em{font-style:normal;font-size:10px;font-weight:800;color:var(--sub);width:11px}
.bar{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}.bar div{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.mrow .v{font-size:11px;font-weight:700;font-family:'Space Mono',monospace;white-space:nowrap}.mrow .g{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--muted);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.07em;padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 4px;border-bottom:1px solid rgba(59,130,246,.07);vertical-align:middle}
.tbl tr:last-child td{border:none}
.tbl .nm{font-weight:700;max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .am{font-size:10px;color:var(--sub)}
.x-btn{color:var(--muted);font-size:14px;padding:4px 6px;border-radius:6px}.x-btn:active{color:#ef4444;background:rgba(239,68,68,.12)}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;animation:fadein .2s ease}
.overlay.out{opacity:0;transition:opacity .22s}
.sheet{background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--border);max-height:92dvh;display:flex;flex-direction:column;animation:slideup .32s cubic-bezier(.32,.72,0,1)}
.sheet.full{height:94dvh;max-height:94dvh}
.sheet.out{animation:slidedown .22s ease forwards}
.sheet-handle{width:38px;height:4px;background:var(--muted);border-radius:2px;margin:10px auto 8px;flex-shrink:0}
.sheet-head{padding:4px 18px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sheet-title{font-size:20px;font-weight:800}
.sheet-right{display:flex;align-items:center;gap:8px}
.x{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--sub);font-size:14px;display:flex;align-items:center;justify-content:center}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--sab) + 24px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.search{margin:0 18px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px}
.search input{flex:1;background:none;border:none;outline:none;padding:11px 0}
.search input::placeholder{color:var(--muted)}

/* food cards */
.fcard{margin:0 18px 10px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--border);animation:rise .35s ease both}
.fc-top{display:flex;gap:12px;align-items:center}
.fc-info{flex:1;min-width:0}
.fc-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-serv{font-size:11px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-kcal{font-size:13px;font-weight:700;color:var(--blue2);font-family:'Space Mono',monospace;margin-top:3px}
.fc-mac{font-size:10px;color:var(--sub);margin-top:2px;font-family:'Space Mono',monospace}
.fc-bot{display:flex;align-items:center;gap:6px;margin-top:10px;justify-content:flex-end}
.step{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:300;line-height:1}
.step:active{background:var(--blue);border-color:var(--blue)}
.amt{width:72px;text-align:center;padding:8px 4px;border-radius:10px;font-weight:700;font-family:'Space Mono',monospace;font-size:14px}
.unit{font-size:11px;color:var(--sub);min-width:22px}
.add{background:var(--blue);padding:9px 18px;border-radius:10px;font-weight:800;font-size:13px;transition:transform .12s,background .2s}
.add:active{transform:scale(.93);background:#2563eb}.add:disabled{opacity:.4}

/* workout */
.sess{margin:0 18px 10px;border-radius:16px;background:var(--card);border:1px solid var(--border);overflow:hidden;animation:rise .35s ease both}
.sess-h{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.sess-ic{width:40px;height:40px;border-radius:12px;background:rgba(59,130,246,.14);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sess-t{font-weight:800;font-size:14px}.sess-s{font-size:11px;color:var(--sub);margin-top:1px}
.sess-b{padding:0 14px 14px;animation:fadein .25s}
.sess-ex{font-weight:700;font-size:12px;color:var(--blue2);margin:10px 0 3px}
.sess-set{font-size:12px;color:var(--sub);font-family:'Space Mono',monospace;line-height:1.7}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.tile{padding:22px 10px;border-radius:18px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:16px;transition:transform .15s,border-color .2s;animation:rise .4s ease both}
.tile span{font-size:34px}.tile:active{transform:scale(.95);border-color:var(--blue)}
.ex-card{margin:0 18px 14px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--border);animation:rise .35s ease both}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-n{font-size:17px;font-weight:900;color:var(--blue2);letter-spacing:-.01em;text-shadow:0 0 18px rgba(59,130,246,.45)}
.ex-m{font-size:11px;color:var(--sub);margin-top:2px}
.last{font-size:11px;color:var(--sub);margin:8px 0 10px;padding:7px 10px;border-radius:9px;background:rgba(59,130,246,.07);font-family:'Space Mono',monospace;line-height:1.5}
.last b{color:var(--blue2);font-family:'Exo 2',sans-serif}
.set{display:grid;grid-template-columns:34px 1fr 50px 62px 38px;gap:6px;align-items:center;margin-bottom:7px}
.set.sg{grid-template-columns:34px 30px 1fr 50px 62px 38px}
.set .inp{padding:9px 6px;text-align:center;font-family:'Space Mono',monospace;font-weight:700;font-size:15px}
.sn{height:34px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-weight:800;font-size:13px;font-family:'Space Mono',monospace;color:var(--sub)}
.sn.warmup{background:rgba(234,179,8,.15);border-color:rgba(234,179,8,.5);color:#facc15}
.sn.failure{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#f87171}
.ut{height:38px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-size:12px;font-weight:800;color:var(--blue2)}
.ut.lb{background:rgba(234,179,8,.12);color:#facc15;border-color:rgba(234,179,8,.4)}
.sgn{height:38px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-weight:800;color:var(--muted);font-size:16px}
.sgn.neg{background:rgba(59,130,246,.2);color:var(--blue2);border-color:var(--blue)}
.tick{height:38px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:17px;transition:all .2s}
.tick.on{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.05)}
.set-h{display:grid;grid-template-columns:34px 1fr 50px 62px 38px;gap:6px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;text-align:center}
.set-h.sg{grid-template-columns:34px 30px 1fr 50px 62px 38px}
.cset{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;padding:10px;border-radius:12px;background:rgba(2,8,23,.4)}
.cset .inp{padding:9px 8px;font-family:'Space Mono',monospace;font-weight:700}
.cset .lbl{margin-bottom:3px;font-size:9px}
.cset-t{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--sub)}

/* PR popup */
.pr-wrap{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;animation:fadein .2s}
.pr-card{position:relative;z-index:2;text-align:center;padding:30px 34px;border-radius:26px;background:linear-gradient(160deg,#0d1a35,#10285a);border:1px solid rgba(250,204,21,.5);box-shadow:0 0 60px rgba(250,204,21,.25);animation:pop .5s cubic-bezier(.34,1.56,.64,1);max-width:86vw}
.pr-trophy{font-size:64px;animation:pop .7s .1s cubic-bezier(.34,1.56,.64,1) both}
.pr-title{font-size:30px;font-weight:900;letter-spacing:.04em;background:linear-gradient(135deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:4px}
.pr-ex{font-size:15px;font-weight:700;margin-top:6px}
.pr-val{font-size:26px;font-weight:700;font-family:'Space Mono',monospace;margin-top:8px;color:#fde047}
.pr-prev{font-size:12px;color:var(--sub);margin-top:6px}
.confetti{position:absolute;left:50%;top:50%;width:9px;height:14px;border-radius:2px;z-index:1;opacity:0;animation:conf 1.5s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

/* charts */
.cwrap{margin:0 18px 14px;padding:12px 8px 8px;border-radius:16px;background:var(--card);border:1px solid var(--border)}
.ct{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin:0 8px 6px;font-weight:700;display:flex;justify-content:space-between}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
.bargrow{transform-origin:center bottom;transform-box:fill-box;animation:grow .7s cubic-bezier(.22,1,.36,1) both}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px 14px}
.stat{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--border);text-align:center}
.stat b{display:block;font-size:20px;font-family:'Space Mono',monospace}.stat small{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 18px 8px;border-radius:14px;background:var(--card);border:1px solid var(--border);width:calc(100% - 36px);text-align:left;animation:rise .3s ease both}
.li-m{flex:1;min-width:0}.li-t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li-s{font-size:11px;color:var(--sub);margin-top:1px}
.li:active{background:var(--bg3)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rc{padding:13px;border-radius:14px;background:rgba(2,8,23,.45);border:1px solid var(--border);text-align:center}
.rc b{display:block;font-size:24px;font-family:'Space Mono',monospace;line-height:1.1}.rc small{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em}

/* toast / login */
.toasts{position:fixed;top:calc(var(--sat) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:600;pointer-events:none}
.toast{pointer-events:auto;background:rgba(13,26,53,.97);border:1px solid var(--border);border-radius:22px;padding:10px 18px;font-size:13px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:rise .3s ease;display:flex;align-items:center;gap:12px;max-width:90vw}
.toast-undo{color:var(--blue2);font-weight:800;font-size:13px}

/* ================= utils ================= */
const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});

/* ================= storage (IndexedDB) ================= */
let _db=null;
const dbp=()=>_db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('sfa2',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const kvGet=async k=>{try{const db=await dbp();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}};
const kvSet=async(k,v)=>{try{const db=await dbp();return await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}};

/* ================= store ================= */
const TABLES=['foods','food_weighings','food_logs','exercises','workout_sessions','workout_sets','cardio_sessions','cardio_intervals','body_metrics','goals','muscle_groups','equipment_types','cardio_machines'];
const PK={goals:'user_id',muscle_groups:'name',equipment_types:'name',cardio_machines:'name'};
const pk=t=>PK[t]||'id';
const emptyDb=()=>Object.fromEntries(TABLES.map(t=>[t,[]]));
let S={phase:'boot',uid:null,db:emptyDb(),queue:[],failed:[],syncing:false,lastPull:null,needLogin:false,toasts:[]};
const subs=new Set();
const setS=p=>{S={...S,...p};subs.forEach(f=>f())};
const useS=()=>React.useSyncExternalStore(f=>{subs.add(f);return()=>subs.delete(f)},()=>S);

const toast=(msg,undo)=>{const id=uuid();setS({toasts:[...S.toasts,{id,msg,undo}]});setTimeout(()=>setS({toasts:S.toasts.filter(t=>t.id!==id)}),undo?4500:2300)};
const dismissToast=id=>setS({toasts:S.toasts.filter(t=>t.id!==id)});

function applyLocal(db,table,kind,rows){
  const key=pk(table);let arr=db[table];
  if(kind==='upsert'){const m=new Map(arr.map(r=>[r[key],r]));rows.forEach(r=>m.set(r[key],{...(m.get(r[key])||{}),...r}));arr=[...m.values()]}
  else{const del=new Set(rows.map(r=>r[key]));arr=arr.filter(r=>!del.has(r[key]))}
  const out={...db,[table]:arr};
  if(kind==='delete'){
    const del=new Set(rows.map(r=>r[key]));
    if(table==='workout_sessions')out.workout_sets=out.workout_sets.filter(s=>!del.has(s.session_id));
    if(table==='cardio_sessions')out.cardio_intervals=out.cardio_intervals.filter(s=>!del.has(s.session_id));
    if(table==='foods'){out.food_weighings=out.food_weighings.filter(s=>!del.has(s.food_id));out.food_logs=out.food_logs.map(l=>del.has(l.food_id)?{...l,food_id:null}:l)}
  }
  return out;
}
let pt=null;
const persistCache=()=>{clearTimeout(pt);pt=setTimeout(()=>{if(S.uid)kvSet('cache:'+S.uid,{db:S.db,t:Date.now()})},700)};
const persistQueue=()=>{if(S.uid)kvSet('queue:'+S.uid,{queue:S.queue,failed:S.failed})};
// Always pass FULL rows to upsert (partial rows break NOT NULL columns on the server).
function mutate(table,kind,rows){
  rows=[].concat(rows);
  setS({db:applyLocal(S.db,table,kind,rows),queue:[...S.queue,{qid:uuid(),table,kind,rows}]});
  persistQueue();persistCache();flush();
}
const sendOp=async op=>{
  try{
    const k=pk(op.table),q=sb.from(op.table);
    if(op.kind==='upsert')return await q.upsert(op.rows,{onConflict:k});
    return await q.delete().in(k,op.rows.map(r=>r[k]));
  }catch(e){return{error:{message:String(e&&e.message||e)},status:0}}
};
const classify=(error,status)=>{
  if(!status)return 'retry';
  if(status===401||error.code==='PGRST301'||/JWT/i.test(error.message||''))return 'auth';
  if(status>=500||status===429||status===408)return 'retry';
  return 'perm';
};
let flushing=false,pulling=false,epoch=0;
async function flush(){
  if(flushing||!S.uid||!S.queue.length||!navigator.onLine)return;
  flushing=true;setS({syncing:true});let refreshed=false;
  try{
    while(S.queue.length){
      const op=S.queue[0];const res=await sendOp(op);
      if(!res.error){epoch++;setS({queue:S.queue.slice(1)});persistQueue();continue}
      const kind=classify(res.error,res.status);
      if(kind==='retry')break;
      if(kind==='auth'){
        if(!refreshed){refreshed=true;try{const r=await sb.auth.refreshSession();if(r.data&&r.data.session)continue}catch(e){}}
        setS({needLogin:true});break;
      }
      setS({queue:S.queue.slice(1),failed:[...S.failed,{...op,error:res.error.message}]});persistQueue();
      toast('One change could not be saved');
    }
  }finally{flushing=false;setS({syncing:false})}
}
async function fetchAll(t){
  const out=[],k=pk(t),size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await sb.from(t).select('*').order(k).range(from,from+size-1);
    if(error)throw error;
    out.push(...data);if(data.length<size)break;
  }
  return out;
}
async function pull(){
  if(pulling||!S.uid||!navigator.onLine)return;
  pulling=true;const e0=epoch;
  try{
    const results=await Promise.all(TABLES.map(fetchAll));
    if(epoch!==e0){pulling=false;return pull()}
    let db=Object.fromEntries(TABLES.map((t,i)=>[t,results[i]]));
    S.queue.forEach(op=>{db=applyLocal(db,op.table,op.kind,op.rows)});
    setS({db,lastPull:Date.now()});persistCache();
  }catch(e){/* offline or signed out: keep local data */}
  finally{pulling=false}
}
async function syncNow(){await flush();await pull()}
async function enter(uid){
  localStorage.setItem('sfa2_uid',uid);
  const c=await kvGet('cache:'+uid),q=await kvGet('queue:'+uid);
  setS({uid,db:{...emptyDb(),...((c&&c.db)||{})},queue:(q&&q.queue)||[],failed:(q&&q.failed)||[],phase:'app',needLogin:false});
  await flush();await pull();
}
async function signIn(email,password){
  const {data,error}=await sb.auth.signInWithPassword({email:email.trim(),password});
  if(error)return error.message;
  localStorage.setItem('sfa2_email',email.trim());
  await enter(data.user.id);return null;
}
async function signOut(){
  try{await sb.auth.signOut()}catch(e){}
  localStorage.removeItem('sfa2_uid');
  setS({phase:'login',uid:null,db:emptyDb(),queue:[],failed:[],needLogin:false});
}
let listening=false;
async function boot(){
  if(!listening){
    listening=true;
    window.addEventListener('online',()=>{setS({});syncNow()});
    window.addEventListener('offline',()=>setS({}));
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
    setInterval(()=>{if(S.queue.length)flush()},45000);
    sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.phase==='app')signOut()});
  }
  let uid=null;
  try{const {data}=await sb.auth.getSession();uid=data&&data.session&&data.session.user.id}catch(e){}
  if(!uid)uid=localStorage.getItem('sfa2_uid');
  if(!uid){setS({phase:'login'});return}
  await enter(uid);
}

function useToday(){
  const [d,setD]=useState(todayStr());
  useEffect(()=>{const f=()=>setD(todayStr());const i=setInterval(f,20000);document.addEventListener('visibilitychange',f);return()=>{clearInterval(i);document.removeEventListener('visibilitychange',f)}},[]);
  return d;
}
const latestBody=(db,date)=>{
  const a=[...db.body_metrics].sort((x,y)=>cmp(x.measured_on,y.measured_on));if(!a.length)return null;
  let pick=null;a.forEach(m=>{if(!date||m.measured_on<=date)pick=m});return pick||a[0];
};
const dispW=s=>(s.entered_unit==='lb'&&s.entered_weight!=null)?show(s.entered_weight)+' lb':show(s.weight_kg)+' kg';
const dispNum=s=>(s.entered_unit==='lb'&&s.entered_weight!=null)?show(s.entered_weight):show(s.weight_kg);
const toKg=s=>{let w=num(s.w);if(w==null)return null;if(s.neg)w=-Math.abs(w);return s.unit==='lb'?r2(w*LB):r2(w)};
const est1rm=(load,reps)=>load>0&&reps>0?load*(1+reps/30):null;
function lastSession(db,exId){
  const sess=new Map(db.workout_sessions.map(s=>[s.id,s]));let best=null;const sets=[];
  db.workout_sets.forEach(s=>{if(s.exercise_id!==exId)return;const ss=sess.get(s.session_id);if(!ss)return;
    const key=ss.session_date+ss.started_at;if(!best||key>best.key)best={key,ss,id:s.session_id}});
  if(!best)return null;
  db.workout_sets.forEach(s=>{if(s.exercise_id===exId&&s.session_id===best.id)sets.push(s)});
  sets.sort((a,b)=>a.set_number-b.set_number);
  return{date:best.ss.session_date,sets};
}
const bestKg=(db,exId)=>{let m=null;db.workout_sets.forEach(s=>{if(s.exercise_id===exId&&s.set_type!=='warmup'&&(m==null||s.weight_kg>m))m=+s.weight_kg});return m};
function buildSessions(db,exId){
  const sess=new Map(db.workout_sessions.map(s=>[s.id,s]));const by=new Map();
  db.workout_sets.forEach(s=>{if(s.exercise_id!==exId||s.set_type==='warmup')return;const ss=sess.get(s.session_id);if(!ss)return;
    if(!by.has(s.session_id))by.set(s.session_id,{s:ss,sets:[]});by.get(s.session_id).sets.push(s)});
  return [...by.values()].sort((a,b)=>cmp(a.s.session_date+a.s.started_at,b.s.session_date+b.s.started_at));
}

/* ================= small UI pieces ================= */
function Sheet({title,onClose,children,full,right}){

  const close=()=>{setOut(true);setTimeout(onClose,220)};

      <div className="sheet-body">${typeof children==='function'?children(close):children}</div>
    </div></div>`,document.getElementById('portal'));
}
function Donut({p=0,c=0,f=0,size=70,sw=9,top,bot}){
  const r=(size-sw)/2,C=2*Math.PI*r,cx=size/2;
  const vals=[[p*4,'#ef4444'],[c*4,'#3b82f6'],[f*9,'#eab308']],tot=vals.reduce((a,v)=>a+v[0],0);
  let off=0;
  const arcs=tot>0?vals.map(([v,col],i)=>{const len=v/tot*C;const el=html`<circle key=${i} cx=${cx} cy=${cx} r=${r} fill="none" stroke=${col} strokeWidth=${sw} strokeDasharray=${len+' '+(C-len)} strokeDashoffset=${-off} transform=${'rotate(-90 '+cx+' '+cx+')'} style=${{transition:'stroke-dasharray .7s ease,stroke-dashoffset .7s ease'}}/>`;off+=len;return el}):[];
  return html`<svg width=${size} height=${size} viewBox=${'0 0 '+size+' '+size} style=${{flexShrink:0,display:'block'}}>
    <circle cx=${cx} cy=${cx} r=${r} fill="none" stroke="#1e293b" strokeWidth=${sw}/>${arcs}
    ${top!=null&&html`<text x=${cx} y=${bot?cx-size*.02:cx+size*.07} textAnchor="middle" fill="#f1f5f9" fontWeight="700" fontFamily="Space Mono,monospace" fontSize=${size*(size>100?.2:.2)}>${top}</text>`}
    ${bot&&html`<text x=${cx} y=${cx+size*.14} textAnchor="middle" fill="#64748b" fontSize=${size*.1} fontFamily="Space Mono,monospace">${bot}</text>`}
  </svg>`;
}
const Stars=({v=0,size=11})=>html`<span className="stars" style=${{fontSize:size}}>${[1,2,3,4,5].map(i=>html`<span key=${i} className=${v>=i-.25?'on':v>=i-.75?'half':''}>★</span>`)}</span>`;

}

}

const Toasts=()=>{const {toasts}=useS();return html`<div className="toasts">${toasts.map(t=>html`<div key=${t.id} className="toast">${t.msg}${t.undo&&html`<button className="toast-undo" onClick=${()=>{t.undo();dismissToast(t.id)}}>Undo</button>`}</div>`)}</div>`};

/* ================= charts ================= */
function LineChart({labels,series,height=170,pick,sel}){
  const W=340,H=height,pl=38,pr=12,pt=12,pb=24;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!all.length)return html`<div className="empty small">No data yet</div>`;
  let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.14;lo-=pad;hi+=pad;
  const n=labels.length,X=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const grid=[0,1,2,3].map(k=>lo+(hi-lo)*k/3);
  const paths=series.map(s=>{let d='',pen=false;s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true});return d});
  const lab=i=>i===0||i===n-1||(n>5&&i===Math.floor((n-1)/2));
  return html`<svg key=${labels.join('|')+series.length} width="100%" viewBox=${'0 0 '+W+' '+H} style=${{display:'block',touchAction:'manipulation'}} onClick=${e=>{if(!pick)return;const r=e.currentTarget.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;let b=0,bd=1e9;for(let i=0;i<n;i++){const dd=Math.abs(X(i)-x);if(dd<bd){bd=dd;b=i}}pick(b)}}>
    ${grid.map((g,k)=>html`<g key=${k}><line x1=${pl} x2=${W-pr} y1=${Y(g)} y2=${Y(g)} stroke="#1e293b" strokeWidth="1"/><text x=${pl-5} y=${Y(g)+3} textAnchor="end" fontSize="9" fill="#475569" fontFamily="Space Mono,monospace">${g>=100?rnd(g):r1(g)}</text></g>`)}
    ${sel!=null&&html`<line x1=${X(sel)} x2=${X(sel)} y1=${pt} y2=${H-pb} stroke="#3b82f6" strokeWidth="1" strokeDasharray="3 3" opacity=".7"/>`}
    ${series.map((s,i)=>html`<path key=${'p'+i} d=${paths[i]} pathLength="1" className="draw" fill="none" stroke=${s.color} strokeWidth=${s.thin?1.6:2.6} strokeLinecap="round" strokeLinejoin="round" opacity=${s.thin?.8:1}/>`)}
    ${series.map((s,i)=>s.vals.map((v,j)=>v==null?null:html`<circle key=${i+'-'+j} cx=${X(j)} cy=${Y(v)} r=${j===sel?5:(s.thin?2.2:3.4)} fill=${s.color} stroke="#020817" strokeWidth="1.5"/>`))}
    ${labels.map((l,i)=>lab(i)?html`<text key=${'l'+i} x=${X(i)} y=${H-6} textAnchor=${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'} fontSize="9" fill="#64748b" fontFamily="Space Mono,monospace">${l}</text>`:null)}
  </svg>`;
}
function BarChart({labels,vals,goal,color='#3b82f6',height=150}){
  const W=340,H=height,pl=38,pr=8,pt=12,pb=22;
  const mx=Math.max(...vals,goal||0,1)*1.12,n=vals.length,gap=(W-pl-pr)/n,bw=Math.max(3,Math.min(26,gap*.68));
  const Y=v=>pt+(H-pt-pb)*(1-v/mx);
  return html`<svg key=${labels.join('|')+color} width="100%" viewBox=${'0 0 '+W+' '+H} style=${{display:'block'}}>
    ${[0,.5,1].map(k=>html`<g key=${k}><line x1=${pl} x2=${W-pr} y1=${Y(mx*k/1.12)} y2=${Y(mx*k/1.12)} stroke="#1e293b"/><text x=${pl-5} y=${Y(mx*k/1.12)+3} textAnchor="end" fontSize="9" fill="#475569" fontFamily="Space Mono,monospace">${rnd(mx*k/1.12)}</text></g>`)}

function Reports({onClose}){
  const {db}=useS();const today=useToday();const goals=db.goals[0];
  const [period,setPeriod]=useState('week');const [metric,setMetric]=useState('kcal');
  const daily=useMemo(()=>{const m={};db.food_logs.forEach(l=>{const d=m[l.logged_date]||(m[l.logged_date]={kcal:0,p:0,c:0,f:0});d.kcal+=+l.kcal;d.p+=+l.protein_g;d.c+=+l.carbs_g;d.f+=+l.fat_g});return m},[db.food_logs]);
  const days=period==='week'?7:period==='month'?30:365;
  const range=useMemo(()=>Array.from({length:days},(_,i)=>addDays(today,i-days+1)),[today,days]);
  const tracked=range.filter(d=>daily[d]);
  const avg=k=>tracked.length?rnd(tracked.reduce((a,d)=>a+daily[d][k],0)/tracked.length):0;
  const G=goals?{kcal:goals.kcal,p:goals.protein_g,c:goals.carbs_g,f:goals.fat_g}:null;
  const hit=tracked.filter(d=>{if(!G)return false;const t=goals.goal_type,x=daily[d];
    const kOk=(t==='loss'||t==='cut'||t==='lose')?x.kcal<=G.kcal:(t==='gain'||t==='bulk')?x.kcal>=G.kcal:Math.abs(x.kcal-G.kcal)<=G.kcal*.1;
    return kOk&&x.p>=G.p}).length;
  const key={kcal:'kcal',protein:'p',carbs:'c',fat:'f'}[metric];
  const series=useMemo(()=>{
    if(period!=='year')return{labels:range.map(d=>d.slice(5)),vals:range.map(d=>daily[d]?r1(daily[d][key]):0)};
    const months=[];for(let i=11;i>=0;i--){const d=new Date(today+'T12:00:00Z');d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()-i);months.push(d.toISOString().slice(0,7))}
    return{labels:months.map(m=>m.slice(2)),vals:months.map(m=>{const ds=Object.keys(daily).filter(d=>d.startsWith(m));return ds.length?rnd(ds.reduce((a,d)=>a+daily[d][key],0)/ds.length):0})};
  },[period,range,daily,key,today]);
  const col={kcal:'#60a5fa',protein:'#ef4444',carbs:'#3b82f6',fat:'#eab308'}[metric];
  const goal=G?G[key]:null;
  return html`<${Sheet} title="📊 Reports" full=${true} onClose=${onClose}>
    <${Seg} value=${period} onChange=${setPeriod} items=${[{v:'week',l:'Weekly'},{v:'month',l:'Monthly'},{v:'year',l:'Yearly'}]}/>
    <div className="stats">
      <div className="stat"><b>${tracked.length}<small> /${days}</small></b><small>days tracked</small></div>
      <div className="stat"><b style=${{color:'#4ade80'}}>${hit}</b><small>goal days 🎯</small></div>
      <div className="stat"><b style=${{color:'#60a5fa'}}>${avg('kcal')}</b><small>avg kcal</small></div>
      <div className="stat"><b style=${{color:'#ef4444'}}>${avg('p')}g</b><small>avg protein</small></div>
      <div className="stat"><b style=${{color:'#3b82f6'}}>${avg('c')}g</b><small>avg carbs</small></div>
      <div className="stat"><b style=${{color:'#eab308'}}>${avg('f')}g</b><small>avg fat</small></div>
    </div>
    <${Chips} value=${metric} onChange=${setMetric} items=${[{v:'kcal',l:'Calories'},{v:'protein',l:'Protein'},{v:'carbs',l:'Carbs'},{v:'fat',l:'Fat'}]}/>
    <div className="cwrap"><div className="ct"><span>${period==='year'?'Monthly average per day':'Daily'}</span>${goal?html`<span>dashed = goal ${goal}</span>`:null}</div>
      <${BarChart} labels=${series.labels} vals=${series.vals} goal=${goal} color=${col}/></div>
    ${!G&&html`<div className="hint mx">Set your goals in the Goals tab to see goal days and the goal line.</div>`}
  <//>`;
}

function Logger({type,onClose}){
  const {db}=useS();
  const [d,setD]=useState(()=>{const x=readDraft();return x&&(!type||x.resume)?x:{id:uuid(),type,startedAt:new Date().toISOString(),blocks:[]}});
  const [pick,setPick]=useState(false),[pr,setPr]=useState(null);
  useEffect(()=>{localStorage.setItem('sfa2_draft',JSON.stringify({...d,resume:false}))},[d]);
  const T=TYPES.find(t=>t.id===d.type)||TYPES[0];
  const setBlock=nb=>setD(x=>({...x,blocks:x.blocks.map(b=>b.bid===nb.bid?nb:b)}));
  const tick=(block,set)=>{
    if(set.done){setBlock({...block,sets:block.sets.map(s=>s.sid===set.sid?{...s,done:false}:s)});return}
    const kg=toKg(set);if(kg==null||num(set.reps)==null){toast('Enter weight and reps first');return}
    const ex=db.exercises.find(e=>e.id===block.exId);
    setBlock({...block,sets:block.sets.map(s=>s.sid===set.sid?{...s,done:true}:s)});
    if(set.tag==='warmup')return;
    const prior=bestKg(db,block.exId);
    if(prior==null){toast('Baseline set logged 👍');return}
    let sm=null;block.sets.forEach(s=>{if(s.sid!==set.sid&&s.done&&s.tag!=='warmup'){const k=toKg(s);if(k!=null&&(sm==null||k>sm))sm=k}});
    const base=Math.max(prior,sm==null?-1e9:sm);
    if(kg>base+0.004){
      const w=num(set.w);
      setPr({name:ex.name,text:(set.neg?'−':'')+show(w)+' '+set.unit+(set.unit==='lb'?' ('+show(kg)+' kg)':''),prev:show(Math.max(prior,sm==null?prior:sm))+' kg'});
    }
  };
  const addEx=ex=>setD(x=>({...x,blocks:[...x.blocks,{bid:uuid(),kind:'s',exId:ex.id,sets:[blankSet(),blankSet(),blankSet()]}]}));
  const addMach=m=>setD(x=>({...x,blocks:[...x.blocks,{bid:uuid(),kind:'c',machine:m.name,ints:[blankInt()]}]}));
  const finish=()=>{
    const date=todayStr(),now=new Date().toISOString(),sid=uuid();const setRows=[],cs=[],ci=[];

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=ch;}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const CSV_COLS=['name','categories','basis','kcal','protein_g','carbs_g','fat_g','serving_label','serving_g','rating','verified'];
function foodsToCsv(foods){
  const lines=[CSV_COLS.join(',')];
  [...foods].filter(f=>!f.archived).sort((a,b)=>cmp(a.name.toLowerCase(),b.name.toLowerCase())).forEach(f=>lines.push([f.name,f.categories.join('|'),f.basis,f.kcal,f.protein_g,f.carbs_g,f.fat_g,f.serving_label||'',f.serving_g==null?'':f.serving_g,f.rating==null?'':f.rating,f.verified?'true':'false'].map(csvCell).join(',')));
  return lines.join('\n');
}
function analyseCsv(text,foods){
  const rows=parseCSV(text);if(rows.length<2)return{error:'The file is empty or has no data rows.'};
  const head=rows[0].map(h=>h.trim().toLowerCase());
  if(!head.includes('name')||!head.includes('kcal'))return{error:'The first row must contain the columns "name" and "kcal".'};
  const idx=k=>head.indexOf(k),existing=new Map(foods.map(f=>[f.name.toLowerCase(),f]));
  const seen=new Set(),items=[];
  rows.slice(1).forEach((r,n)=>{
    const get=k=>{const i=idx(k);return i<0?'':(r[i]||'').trim()};
    const name=get('name');const bad=m=>items.push({line:n+2,name:name||'(blank)',err:m});
    if(!name)return bad('missing name');if(seen.has(name.toLowerCase()))return bad('duplicate name in file');seen.add(name.toLowerCase());
    const kcal=num(get('kcal'));if(kcal==null||kcal<0)return bad('kcal must be a number');
    const basis=(get('basis')||'per_100g').toLowerCase();if(!['per_100g','per_serving'].includes(basis))return bad('basis must be per_100g or per_serving');
    const cats=get('categories').split(/[|;,]/).map(x=>x.trim().toLowerCase()).filter(Boolean);const bc=cats.find(c=>!MEALS.includes(c));if(bc)return bad('unknown meal "'+bc+'"');
    const mac={};for(const [k,c] of [['protein_g','protein'],['carbs_g','carbs'],['fat_g','fat']]){const v=get(k)===''?0:num(get(k));if(v==null||v<0)return bad(c+' must be a number');mac[k]=v}
    const rating=get('rating')===''?null:num(get('rating'));if(rating!=null&&(rating<0||rating>5))return bad('rating must be 0 to 5');
    const sg=get('serving_g')===''?null:num(get('serving_g'));if(sg!=null&&sg<=0)return bad('serving_g must be above 0');
    const food={name,categories:cats,rating,basis,kcal,...mac,serving_label:get('serving_label')||null,serving_g:sg,verified:/^(true|1|yes|y)$/i.test(get('verified'))};
    const ex=existing.get(name.toLowerCase());items.push({line:n+2,name,food:ex?{...ex,...food,id:ex.id}:{...food,id:uuid(),archived:false},isNew:!ex});
  });
  return{items};
}

    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()};

      <div className="search"><span>🔍</span><input placeholder=${'Search '+db.exercises.length+' exercises…'} value=${q} onChange=${e=>setQ(e.target.value)}/></div>
      ${exs.map((e,i)=>html`<button key=${e.id} className="li" style=${{opacity:e.archived?.5:1,animationDelay:Math.min(i,10)*.02+'s'}} onClick=${()=>setForm({kind:'ex',item:e})}>
        <div className="li-m"><div className="li-t">${e.name}${e.archived?' (hidden)':''}</div><div className="li-s">${e.muscle_group} · ${e.equipment.replace('_',' ')}${e.load_type==='per_dumbbell'?' · each dumbbell':e.load_type==='signed_bodyweight'?' · assisted/weighted':''}</div></div><span className="pill">${typeOf(e)}</span></button>`)}
      ${!exs.length&&html`<div className="empty"><b>🏋️</b>No exercises found</div>`}
    </div>`}
    ${sub==='data'&&html`<div className="mx">
      <div className="card pad mb"><div className="lbl">Sync</div>
        <div style=${{fontSize:14,fontWeight:700}}>${!navigator.onLine?'📴 Offline':queue.length?'⏳ '+queue.length+' change'+(queue.length>1?'s':'')+' waiting':'✅ All changes saved'}</div>
        <div className="hint">${lastPull?'Last refreshed '+new Date(lastPull).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'}):'Not refreshed yet'}. Everything saves to your account automatically, even if you log offline.</div>
        <button className="btn ghost" style=${{marginTop:10}} disabled=${syncing} onClick=${async()=>{await syncNow();toast('Up to date ✓')}}>${syncing?'Syncing…':'🔄 Sync now'}</button>
        ${failed.length>0&&html`<div><div className="err" style=${{marginTop:12}}>${failed.length} change${failed.length>1?'s':''} could not be saved.</div><div className="row"><button className="btn ghost sm" onClick=${retry}>Retry</button><button className="btn danger sm" onClick=${()=>{if(confirm('Discard the failed changes?')){setS({failed:[]});persistQueue()}}}>Discard</button></div></div>`}
      </div>
      <div className="card pad mb"><div className="lbl">Account</div><button className="btn danger" onClick=${()=>{if(confirm('Sign out? Unsaved changes stay on this phone until you sign back in.'))signOut()}}>Sign out</button></div>
      <div className="hint" style=${{textAlign:'center'}}>Sijin's Fitness App v${VERSION}</div>
    </div>`}
    ${form&&html`<${Sheet} title=${form.kind==='food'?(form.item?'Edit food':'New food'):(form.item?'Edit exercise':'New exercise')} full=${true} onClose=${()=>setForm(null)}>${close=>form.kind==='food'?html`<${FoodForm} food=${form.item} onDone=${close}/>`:html`<${ExerciseForm} ex=${form.item} onDone=${close}/>`}<//>`}
    ${imp&&html`<${ImportSheet} onClose=${()=>setImp(false)}/>`}
    ${exp!=null&&html`<${ExportSheet} text=${exp} name="foods_master.csv" onClose=${()=>setExp(null)}/>`}
  </div>`;
}

/* ================= shell ================= */
function Login({overlay}){
  const [email,setEmail]=useState(localStorage.getItem('sfa2_email')||''),[pw,setPw]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const go=async()=>{if(!email||!pw){setErr('Enter your email and password.');return}setBusy(true);setErr('');const e=await signIn(email,pw);setBusy(false);if(e)setErr(e)};
  return html`<div className="login"><div className="login-c">
    <h1>Sijin's Fitness</h1><p>${overlay?'Please sign in again to keep syncing. Your data is safe on this phone.':'Sign in to your account'}</p>
    <div className="fg"><label className="lbl">Email</label><input className="inp" type="email" autoCapitalize="none" autoCorrect="off" value=${email} onChange=${e=>setEmail(e.target.value)}/></div>
    <div className="fg"><label className="lbl">Password</label><input className="inp" type="password" value=${pw} onChange=${e=>setPw(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')go()}}/></div>
    ${err&&html`<div className="err">${err}</div>`}
    <button className="btn" disabled=${busy} onClick=${go}>${busy?'Signing in…':'Sign in'}</button>
  </div></div>`;
}
const TABS=[{id:'goals',l:'Goals',e:'🎯',C:Goals},{id:'food',l:'Log Food',e:'🍽️',C:LogFood,main:true},{id:'work',l:'Workout',e:'🏋️',C:Workout,main:true},{id:'create',l:'Create',e:'➕',C:Create}];
function App(){
  const s=useS();const [tab,setTab]=useState(1);
  useEffect(()=>{boot()},[]);
  if(s.phase==='boot')return html`<div className="splash">Sijin's Fitness</div>`;
  if(s.phase==='login')return html`<div><${Login}/><${Toasts}/></div>`;
  return html`<div className="app">
    ${TABS.map((t,i)=>html`<div key=${t.id} className=${'tab'+(tab===i?' on':'')}><${t.C}/></div>`)}
    <div className="nav">${TABS.map((t,i)=>html`<button key=${t.id} className=${'nav-i'+(tab===i?' on':'')+(t.main?' main':'')} onClick=${()=>setTab(i)}><span>${t.e}</span>${t.l}</button>`)}</div>
    <${Toasts}/>
    ${s.needLogin&&html`<${Login} overlay=${true}/>`}
  </div>`;
}
window.__sfa={getS:()=>S,mutate,flush,pull,syncNow};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
